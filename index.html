<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ocean Number Game</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
color:white;
text-align:center;

background:url("dynamic-anime-waves-stockcake.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:30px;
}

h1{
font-size:50px;
text-shadow:0 0 15px cyan;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-8px);
}
}

.box{
max-width:700px;
margin:auto;
padding:20px;

background:rgba(0,0,0,0.6);
border:2px solid white;
border-radius:15px;

backdrop-filter:blur(5px);
}

input,select,button{

padding:10px;
margin:8px;
font-size:18px;

border:none;
border-radius:8px;

}

button{
cursor:pointer;
background:white;
}

button:hover{
background:cyan;
}

#message{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

#board{
margin-top:20px;
text-align:left;
}

.record{
color:gold;
}

</style>
</head>
<body>

<div class="overlay">

<h1>🌊 Guess The Number 🌊</h1>

<div class="box">

<input id="nickname"
placeholder="Steam Nickname">

<br>

<select id="level">

<option value="0">Level 1 (1-10)</option>
<option value="1">Level 2 (1-20)</option>
<option value="2">Level 3 (1-50)</option>
<option value="3">Level 4 (1-100)</option>
<option value="4">Level 5 (1-200)</option>
<option value="5">Level 6 (1-500)</option>
<option value="6">Level 7 (1-1000)</option>

</select>

<br>

<button onclick="startGame()">Start Game</button>

<br>

<input
id="guess"
type="number"
placeholder="Enter number">

<button onclick="guessNumber()">
Guess
</button>

<div id="message"></div>

<h2 class="record">
Best Score:
<span id="bestscore">
No Record
</span>
</h2>

<div id="board">

<h2>Leaderboard</h2>

<div id="leaderboard"></div>

</div>

</div>

</div>

<script>

let levels=[10,20,50,100,200,500,1000];
let attemptsList=[5,5,5,10,20,50,100];

let secretNumber;
let attempts;
let maxAttempts;

let leaderboard=
JSON.parse(
localStorage.getItem("leaderboard")
)||[];

let bestScore=
localStorage.getItem("bestscore");

showBest();
showBoard();

function showBest(){

document.getElementById("bestscore")
.innerText=
bestScore || "No Record";

}

function startGame(){

let level=
document.getElementById("level").value;

secretNumber=
Math.floor(
Math.random()*levels[level]
)+1;

attempts=1;

maxAttempts=
attemptsList[level];

document.getElementById("message")
.innerText=
"Game Started";

}

function guessNumber(){

if(secretNumber===undefined){

alert("Start game first!");

return;

}

let guess=
Number(
document.getElementById("guess").value
);

if(guess===secretNumber){

let name=
document.getElementById("nickname")
.value || "Unknown";

document.getElementById("message")
.innerText=
"🎉 You Win! Attempts: "
+attempts;

if(
!bestScore ||
attempts<bestScore
){

bestScore=attempts;

localStorage.setItem(
"bestscore",
bestScore
);

showBest();

}

leaderboard.push({

name:name,
attempts:attempts,
status:"Won"

});

saveBoard();

secretNumber=undefined;

return;

}

if(attempts>=maxAttempts){

let name=
document.getElementById("nickname")
.value || "Unknown";

document.getElementById("message")
.innerText=
"💀 Game Over!";

leaderboard.push({

name:name,
attempts:attempts,
status:"Lost"

});

saveBoard();

secretNumber=undefined;

return;

}

if(guess<secretNumber){

document.getElementById("message")
.innerText=
"Too low";

}else{

document.getElementById("message")
.innerText=
"Too high";

}

attempts++;

}

function saveBoard(){

localStorage.setItem(
"leaderboard",
JSON.stringify(
leaderboard
)
);

showBoard();

}

function showBoard(){

let box=
document.getElementById(
"leaderboard"
);

box.innerHTML="";

leaderboard.forEach(player=>{

box.innerHTML+=`

<p>
👤 ${player.name}
|
${player.status}
|
${player.attempts} attempts
</p>

`;

});

}

</script>

</body>
</html>
