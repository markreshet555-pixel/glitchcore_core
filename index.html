<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess The Number | Japan Edition</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:
    linear-gradient(rgba(0,0,40,.55),rgba(0,0,40,.65)),
    url("dynamic-anime-waves-stockcake.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

.container{
    width:90%;
    max-width:800px;
    margin:auto;
    padding-top:40px;
}

.card{
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(8px);
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.3);
}

h1{
    text-align:center;
    font-size:3rem;
    text-shadow:0 0 15px cyan;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#7ed8ff;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:white;
}

#message{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

#leaderboard{
    margin-top:25px;
}

.record{
    color:gold;
    font-weight:bold;
}

.player{
    padding:8px;
    margin-top:5px;
    background:rgba(255,255,255,.1);
    border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🌊 Guess The Number 🌊</h1>

<input
id="nickname"
placeholder="Steam Nickname">

<select id="level">

<option value="0">Level 1 (1-10)</option>
<option value="1">Level 2 (1-20)</option>
<option value="2">Level 3 (1-50)</option>
<option value="3">Level 4 (1-100)</option>
<option value="4">Level 5 (1-200)</option>
<option value="5">Level 6 (1-500)</option>
<option value="6">Level 7 (1-1000)</option>

</select>

<button onclick="startGame()">
Start Game
</button>

<input
id="guess"
type="number"
placeholder="Enter Number">

<button onclick="makeGuess()">
Guess
</button>

<div id="message"></div>

<h3 class="record">
🏆 Best Score:
<span id="bestScore">No Record</span>
</h3>

<div id="leaderboard">

<h2>Leaderboard</h2>

<div id="players"></div>

</div>

</div>

</div>

<script>

let bestScore =
localStorage.getItem("bestScore");

let leaderboard =
JSON.parse(localStorage.getItem("leaderboard")) || [];

let levels=[10,20,50,100,200,500,1000];
let maxAttemptsList=[5,5,5,10,20,50,100];

let secretNumber;
let attempts;
let maxAttempts;
let currentLevel;

showBoard();

if(bestScore){
document.getElementById("bestScore").innerText =
bestScore;
}

function startGame(){

currentLevel =
Number(document.getElementById("level").value);

secretNumber =
Math.floor(
Math.random()*levels[currentLevel]
)+1;

attempts=1;

maxAttempts =
maxAttemptsList[currentLevel];

document.getElementById("message")
.innerHTML=
"Game Started!";

}

function makeGuess(){

if(secretNumber===undefined){
alert("Start the game first!");
return;
}

let guess =
Number(
document.getElementById("guess").value
);

if(guess===secretNumber){

let name =
document.getElementById("nickname").value
|| "Unknown";

document.getElementById("message")
.innerHTML=
"🎉 Victory! Attempts: "
+ attempts;

if(
bestScore===null ||
attempts < Number(bestScore)
){

bestScore=attempts;

localStorage.setItem(
"bestScore",
bestScore
);

document.getElementById("bestScore")
.innerText=bestScore;

}

leaderboard.push({
name:name,
level:currentLevel+1,
attempts:attempts,
status:"Won"
});

saveBoard();

secretNumber=undefined;

return;
}

if(attempts>=maxAttempts){

let name =
document.getElementById("nickname").value
|| "Unknown";

document.getElementById("message")
.innerHTML=
"💀 Game Over! Number was "
+ secretNumber;

leaderboard.push({
name:name,
level:currentLevel+1,
attempts:attempts,
status:"Lost"
});

saveBoard();

secretNumber=undefined;

return;
}

if(guess<secretNumber){
document.getElementById("message")
.innerHTML=
"⬆ Too Low!";
}
else{
document.getElementById("message")
.innerHTML=
"⬇ Too High!";
}

attempts++;

}

function saveBoard(){

localStorage.setItem(
"leaderboard",
JSON.stringify(leaderboard)
);

showBoard();

}

function showBoard(){

let players =
document.getElementById("players");

players.innerHTML="";

leaderboard.forEach(player=>{

players.innerHTML+=`

<div class="player">

👤 ${player.name}
|
Level ${player.level}
|
${player.attempts} attempts
|
${player.status}

</div>

`;

});

}

</script>

</body>
</html>
